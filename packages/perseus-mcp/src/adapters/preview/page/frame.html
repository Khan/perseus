<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- No icon, so the browser doesn't request /favicon.ico. -->
        <link rel="icon" href="data:," />
        <title>Perseus item</title>
        <!-- The other fonts Storybook loads. -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css?family=Inconsolata"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro&display=swap"
        />
        <style>
            /* The page styles (imported by the frame's script) set the root
               font size, fonts and colors, and stretch the body to the
               viewport. The shell sizes this frame to fit #root, so the
               padding goes there and the frame never scrolls. */
            body {
                overflow: hidden;
            }
            #root {
                padding: 1.6rem;
                /* Perseus hangs each hint's "n / total" label to the left
                   of the hint (.perseus-hint-label), in the gutter the
                   exercise page leaves; this is that gutter. */
                padding-inline-start: 6.4rem;
            }
            /* As on a phone, the frame is the phone's screen: a phone's
               page margins, and no gutter. */
            body.mobile #root {
                padding: 1.6rem;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <!-- Relative to the page directory; Vite adds the /preview/ base. -->
        <script type="module" src="/frame.tsx"></script>
    </body>
</html>
