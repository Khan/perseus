<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Perseus draft preview</title>
        <!-- The page's styles are inlined here when the page is built. -->
        <style>
            /* The host sizes the page to fit, so it never scrolls. */
            body {
                height: auto;
                overflow: hidden;
            }
            #root {
                padding: 1.6rem;
                /* Perseus hangs each hint's "n / total" label to the left
                   of the hint (.perseus-hint-label), in the gutter the
                   exercise page leaves; this is that gutter. */
                padding-inline-start: 6.4rem;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <!-- The page's script is inlined here when the page is built. -->
    </body>
</html>
