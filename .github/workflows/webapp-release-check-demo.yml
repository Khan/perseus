# ⚠️ TEMPORARY — FOR DEMO ONLY. DO NOT MERGE TO main. Delete this file (and the
# .changeset/demo-webapp-required.md changeset) after the demo.
#
# This runs the same "does this release need a webapp PR?" detection as the real
# check in publish.yml, but at PR level so it can be demonstrated on a normal PR.
# The production version lives in the `release` job of publish.yml and only runs
# on push to main; this file exists purely to make the behavior visible on a PR.
name: TEMP Webapp Release Check (PR demo)

on:
    pull_request:
        types: [opened, synchronize, reopened]

env:
    WEBAPP_REQUIRED_COMMENT_MARKER: "<!-- perseus-webapp-required-comment -->"
    # Same policy list as publish.yml.
    WEBAPP_RELEASE_PACKAGES: >-
        @khanacademy/perseus-core
        @khanacademy/perseus-score
        @khanacademy/perseus-linter
        @khanacademy/pure-markdown

jobs:
    webapp-check-demo:
        name: Detect webapp-required (demo)
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write # For labeling this PR
            issues: write # For creating/updating the comment
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Detect whether a webapp release is required
              id: webapp_check
              shell: bash
              run: |
                  set -euo pipefail
                  alt=$(printf '%s' "$WEBAPP_RELEASE_PACKAGES" \
                      | tr -s ' \t' '\n' | grep -v '^$' | paste -sd'|' -)
                  matched=""
                  shopt -s nullglob
                  for f in "$GITHUB_WORKSPACE"/.changeset/*.md; do
                      [ "$(basename "$f")" = "README.md" ] && continue
                      hits=$(awk '/^---[[:space:]]*$/{c++; next} c==1{print}' "$f" \
                          | grep -oE "\"(${alt})\"[[:space:]]*:" \
                          | sed -E 's/"([^"]+)".*/\1/' || true)
                      [ -n "$hits" ] && matched="${matched}${hits}"$'\n'
                  done
                  matched=$(printf '%s' "$matched" | grep -v '^$' | sort -u || true)
                  if [ -n "$matched" ]; then
                      echo "required=yes" >> "$GITHUB_OUTPUT"
                  else
                      echo "required=no" >> "$GITHUB_OUTPUT"
                  fi
                  pkgs=$(printf '%s' "$matched" | paste -sd', ' -)
                  echo "packages=${pkgs}" >> "$GITHUB_OUTPUT"
                  echo "webapp required: ${matched:+yes}${matched:-no} (${pkgs:-none})"

            - name: Compose webapp-required comment body
              id: webapp_body
              if: steps.webapp_check.outputs.required == 'yes'
              shell: bash
              env:
                  PACKAGES: ${{ steps.webapp_check.outputs.packages }}
              run: |
                  set -euo pipefail
                  {
                      echo "body<<COMMENT_EOF"
                      echo "$WEBAPP_REQUIRED_COMMENT_MARKER"
                      echo "### ⚠️ Webapp + Frontend release required"
                      echo ""
                      echo "This release directly changes: ${PACKAGES}."
                      echo ""
                      echo "After publishing, create **both** a webapp PR and a frontend PR."
                      echo ""
                      echo "<sub>Determined from changeset frontmatter against the webapp-release package policy. Recomputed on every merge to \`main\`.</sub>"
                      echo "COMMENT_EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Find existing webapp-required comment
              id: webapp_find
              uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
              with:
                  issue-number: ${{ github.event.pull_request.number }}
                  comment-author: "github-actions[bot]"
                  body-includes: ${{ env.WEBAPP_REQUIRED_COMMENT_MARKER }}

            - name: Upsert webapp-required comment
              if: steps.webapp_check.outputs.required == 'yes'
              uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
              with:
                  comment-id: ${{ steps.webapp_find.outputs.comment-id }}
                  issue-number: ${{ github.event.pull_request.number }}
                  body: ${{ steps.webapp_body.outputs.body }}
                  edit-mode: replace

            - name: Apply required-webapp-release label
              if: steps.webapp_check.outputs.required == 'yes'
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NUM: ${{ github.event.pull_request.number }}
              run: |
                  set -euo pipefail
                  # `|| true`: label must be pre-created in the repo (gh won't auto-create).
                  gh pr edit "$NUM" --repo "$GITHUB_REPOSITORY" --add-label "required-webapp-release" || true
